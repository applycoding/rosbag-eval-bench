# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install --require-hashes -r requirements.lock.txt
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check rosbag_eval_bench tests
      - name: Pytest
        run: pytest tests/
      - name: Default suite exits 0
        run: |
          reb eval --suite fixtures/suite.yaml --baseline fixtures/baselines/suite.json --out reports/ci_nominal
          test $? -eq 0
      - name: Degraded suite exits 1
        run: |
          set +e
          reb eval --suite fixtures/suite_degraded.yaml --baseline fixtures/baselines/suite.json --out reports/ci_degraded
          code=$?
          set -e
          test "$code" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("reports/ci_degraded/results.json").read_text())
          fails = {r["name"] for r in data["compare_rows"] if not r["passed"] and r.get("gated")}
          for name in ("full_stack.ate_rmse", "full_stack.path_length", "full_stack.map"):
              assert name in fails, fails
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports
          path: reports/

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26.13.0"
      - name: Build and test web
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npx tsc --noEmit
          npx vitest run
          npm run build
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          sleep 3
          npx playwright install chromium
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173/rosbag-eval-bench/ npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-dist
          path: web/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-screenshot
          path: docs/demo.png
        if: hashFiles('docs/demo.png') != ''

  comment:
    needs: [core]
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reports
          path: reports
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- reb-ci-summary -->';
            let body = marker + '\n\n## reb eval summary\n\nCore job finished. See workflow artifacts for reports.';
            try {
              const p = 'reports/ci_degraded/results.json';
              if (fs.existsSync(p)) {
                const data = JSON.parse(fs.readFileSync(p, 'utf8'));
                const fails = (data.compare_rows || []).filter(r => r.gated && !r.passed).map(r => r.name);
                body += '\n\nDegraded FAIL rows: ' + (fails.length ? fails.join(', ') : 'none');
              }
            } catch (e) {}
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  pages:
    needs: [core, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-dist
          path: dist
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  humble_smoke:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Humble smoke (informational)
        run: python3 tools/humble_smoke.py
